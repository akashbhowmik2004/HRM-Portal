server{
    listen 443 ssl;
    http2 on;
    server_name hrmportal.cc.cd www.hrmportal.cc.cd;
    ssl_certificate /etc/letsencrypt/live/hrmportal.cc.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrmportal.cc.cd/privkey.pem;
    root /usr/share/nginx/html/hrmportal;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}